<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <!--
        前端的入口頁（0.10.10 起，WASM 遷移 M11；取代 MyProject.Web 的主機頁 App.razor）。
        建置與發佈時 SDK 會填入下面兩個佔位（OverrideHtmlAssetPlaceholders）：preload 的連結、import map（指紋檔名與完整性雜湊），
        並把 blazor.webassembly 檔名裡的指紋佔位換成實際的檔名。
        ⚠️ import map 是唯一的行內腳本，CSP 帶它的 SHA-256（同站台由 API 主機算、靜態站發佈時寫進 web.config）；不要再加其他行內腳本。
    -->
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MyProject.Web.Client.styles.css" />
    <script type="importmap"></script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- PWA（0.10.11 起）：可安裝到桌面或主畫面；Service Worker 由 js/pwa.js 註冊。 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="images/icon-192.png" />

    <link href="_content/AntDesign/css/ant-design-blazor.css" rel="stylesheet" />

    <!-- ⚠️ theme.css 必須排在 AntDesign 之後：排在前面的話，對 .ant-* 的覆寫會
         在同分特異性上輸給 AntDesign 而靜默失效。由 ThemeConventionTests 守門。 -->
    <link rel="stylesheet" href="theme.css" />

    <link href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Sharp|Material+Icons+Round|Material+Icons+Two+Tone" rel="stylesheet" />
</head>

<body>
    <!--
        根元件 ClientRoutes 掛在這裡（Program.cs），掛上後取代下面的載入卡片（0.10.13 起：下載與初始化期間不再整片空白）。
        進度條與百分比由 Blazor 下載時設定的 CSS 變數 --blazor-load-percentage／--blazor-load-percentage-text 驅動（樣式在 app.css），不需要行內腳本。
        ⚠️ 系統名稱是固定值（這時還讀不到伺服器設定），與 manifest.webmanifest、Commons/ClientLoadingScreen.razor 一致（LoadingAndStatusPageTests 守門）。
    -->
    <div id="app">
        <div class="app-loading" role="status" aria-live="polite">
            <div class="app-loading-card">
                <img class="app-loading-logo" src="images/icon-192.png" alt="" />
                <p class="app-loading-title">企業管理平台</p>
                <div class="app-loading-bar" aria-hidden="true"><div class="app-loading-bar-fill"></div></div>
                <p class="app-loading-text">正在載入，請稍候… <span class="app-loading-percent"></span></p>
                <p class="app-loading-hint">第一次開啟需要下載程式，之後會更快</p>
                <!-- 啟動失敗（離線第一次開、檔案被手改導致完整性驗證失敗、瀏覽器不支援…）時卡片不會被取代：30 秒後才浮現這句（純 CSS，app.css 的 .app-loading-stuck）。 -->
                <p class="app-loading-stuck">若一直停在這個畫面，請重新整理；仍然無法開啟請聯絡系統管理員。</p>
            </div>
        </div>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/AntDesign/js/ant-design-blazor.js"></script>
    <script src="js/file-download.js"></script>
    <script src="js/clipboard.js"></script>
    <script src="js/nav-state.js"></script>
    <script src="js/client-error-reporter.js"></script>
    <script src="js/pwa.js"></script>
</body>

</html>
