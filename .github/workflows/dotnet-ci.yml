name: .NET CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: windows-latest

    # 提高 NuGet HTTP 逾時，涵蓋 job 內所有步驟（restore 才是最常被 nuget.org 偶發逾時打到的一步）。
    env:
      NUGET_HTTP_TIMEOUT_SECONDS: "180"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # 以 Directory.Packages.props（CPM 的版本單一來源）與各 .csproj 當 key。
      # 不用 setup-dotnet 的 cache：它預設以 **/packages.lock.json 當 hash 依據，本 repo 沒有 lock 檔。
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/MyProject/Directory.Packages.props', 'src/MyProject/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/MyProject/MyProject.slnx

      - name: Build
        run: dotnet build src/MyProject/MyProject.slnx --configuration Release --no-restore

      - name: Format check
        run: dotnet format src/MyProject/MyProject.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test src/MyProject/MyProject.slnx --configuration Release --no-build --verbosity normal

      - name: Documentation encoding check
        shell: pwsh
        run: ./scripts/Test-DocsEncoding.ps1

      # ⚠️ `dotnet list package --vulnerable` 找到弱點時**仍然回傳 0**。
      #    0.9.32 之前這一步直接跑它，等於整道關卡從來沒有擋過任何東西。
      #    這裡改為自己解析輸出，並以「允許清單」處理已記錄決議的諮詢。
      #    清單只能縮短：某筆諮詢一旦不再出現（上游修好了），這一步會失敗並要求你
      #    把它從清單移除 —— 避免豁免變成永久的。決議紀錄見
      #    docs/operations/CI-CD與品質檢查.md §4.1。
      #    比對用諮詢代號而非訊息文字：dotnet CLI 的輸出會隨執行環境語系改變。
      - name: Vulnerability scan
        shell: pwsh
        run: |
          $allowed = @('GHSA-2m69-gcr7-jv3q')
          $output = dotnet list src/MyProject/MyProject.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $output
          $found = [regex]::Matches($output, 'advisories/(?<id>[A-Za-z0-9-]+)') |
            ForEach-Object { $_.Groups['id'].Value } | Sort-Object -Unique
          $unexpected = @($found | Where-Object { $allowed -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            Write-Output "::error::發現未列入允許清單的套件弱點：$($unexpected -join ', ')"
            exit 1
          }
          $stale = @($allowed | Where-Object { $found -notcontains $_ })
          if ($stale.Count -gt 0) {
            Write-Output "::error::允許清單中的諮詢已不再出現，請從清單與文件中移除：$($stale -join ', ')"
            exit 1
          }
          Write-Output "套件弱點掃描通過（允許清單：$($allowed -join ', ')）"
